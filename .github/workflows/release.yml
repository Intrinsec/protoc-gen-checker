name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.27.3"
          cache: true

      - uses: sigstore/cosign-installer@v3.10.1

      - uses: anchore/sbom-action/download-syft@v0.24.3

      - uses: goreleaser/goreleaser-action@v6.4.0
        with:
          distribution: goreleaser
          version: v2.18.3  # keep in sync with GORELEASER_VERSION in Makefile
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_EXPERIMENTAL: "1"
