name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.3"
          cache: true

      - name: gofmt
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "::error::gofmt diff:"
            echo "$fmt_out"
            exit 1
          fi

      - name: install pinned tools
        run: |
          make tools
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: golangci-lint
        run: golangci-lint run --timeout=5m .

      - name: govulncheck
        run: govulncheck ./...

      - name: go test
        run: go test ./... -count=1 -race

      - name: go build
        run: go build ./...
